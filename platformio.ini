; ESP32 + MPU-6050 web server (Random Nerd Tutorials)
; https://randomnerdtutorials.com/esp32-mpu-6050-web-server/
;
; Wiring: MPU-6050 SDA -> GPIO 21, SCL -> GPIO 22, VCC 3.3V, GND
;
; Before upload:
;   1. Copy include/wifi_credentials.h.example -> include/wifi_credentials.h
;   2. Set your WiFi SSID and password there
;
; Upload firmware:  pio run -t upload
; Upload web files: pio run -t uploadfs
; Serial monitor:  pio device monitor

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
board_build.filesystem = littlefs
lib_deps =
    adafruit/Adafruit MPU6050@^2.2.6
    adafruit/Adafruit Unified Sensor@^1.1.14
    adafruit/Adafruit BusIO@^1.16.1
    arduino-libraries/Arduino_JSON@^0.2.0
    ESP32Async/ESPAsyncWebServer@^3.6.0
    ESP32Async/AsyncTCP@^3.3.2
